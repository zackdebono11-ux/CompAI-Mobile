
name: CompAI

options:
  bundleIdPrefix: com.zackdebono
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.zackdebono.compai
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  CompAI:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: CompAI
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - framework: Frameworks/Shared.xcframework
        embed: false
