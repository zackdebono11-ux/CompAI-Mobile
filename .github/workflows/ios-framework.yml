
name: Build iOS Framework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:

  
    name: Build Kotlin iOS XCFramework
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
            - name: List available framework tasks
        run: ./gradlew :shared:tasks --all

      - name: Build iOS XCFramework
        run: ./gradlew :shared:assembleCompAISharedDebugXCFramework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: CompAI-iOS-XCFramework
          path: shared/build/XCFrameworks/debug/CompAIShared.xcframework
          if-no-files-found: error
          retention-days: 14
