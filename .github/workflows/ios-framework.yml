
name: Build CompAI iOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build CompAI for iOS
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Kotlin XCFramework
        run: ./gradlew :shared:assembleSharedDebugXCFramework

      - name: Prepare iOS framework
        run: |
          mkdir -p iosApp/Frameworks
          cp -R shared/build/XCFrameworks/debug/Shared.xcframework iosApp/Frameworks/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build CompAI iOS Simulator App
        run: |
          xcodebuild \
            -project iosApp/CompAI.xcodeproj \
            -scheme CompAI \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: CompAI-iOS-Build
          path: build/ios/Build/Products/Debug-iphonesimulator/CompAI.app
          if-no-files-found: error
          retention-days: 14
